name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Tools for the native build (meson, ninja, patch)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patch file xz-utils cmake
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Android SDK, NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the gnubg engine (glib + engine, arm64)
        run: |
          chmod +x build_glib_android.sh build_native_android.sh
          ./build_native_android.sh

      - name: Build the APK
        working-directory: gnubg-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AnalyzePosition-apk
          path: gnubg-app/app/build/outputs/apk/release/*.apk
